name: Fehlerbericht
description: Einen reproduzierbaren Fehler oder eine technische Regression melden.
title: "[Fehler]: "
body:
  - type: markdown
    attributes:
      value: |
        Bitte melde einen konkreten Fehler. Keine Passwörter, Tokens oder vertraulichen Daten eintragen.
  - type: textarea
    id: observed
    attributes:
      label: Beobachtetes Verhalten
      description: Was passiert tatsächlich?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was sollte stattdessen passieren?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zum Reproduzieren
      description: Möglichst klein und der Reihe nach.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Branch oder Commit
      description: Wenn bekannt, den geprüften Branch/Commit nennen.
  - type: input
    id: environment
    attributes:
      label: Browser und Gerät
      description: Zum Beispiel Chrome unter Windows oder Android Chrome.
  - type: textarea
    id: evidence
    attributes:
      label: Beleg und Grenzen
      description: Screenshot/Log nur soweit unbedenklich; angeben, was noch nicht geprüft wurde.
