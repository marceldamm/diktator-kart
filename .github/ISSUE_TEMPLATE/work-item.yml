name: Aufgabe oder Vorschlag
description: Eine klar abgegrenzte Projektaufgabe, Verbesserung oder offene Idee erfassen.
title: "[Aufgabe]: "
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues ergänzen die vier Teamdateien. Bitte nur bestätigte, klar abnehmbare Aufträge einem Coding Agent zuweisen.
  - type: dropdown
    id: decision_status
    attributes:
      label: Auftragsstatus
      options:
        - Bestätigter Auftrag
        - Unbestätigter Vorschlag
        - Technische Fehlerbehebung
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Herkunft und Bestätigung
      description: Wer hat den Wunsch geäußert, wann und wo ist er bestätigt oder noch offen?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Ziel und Problem
      description: Welches beobachtbare Ergebnis soll diese Aufgabe erreichen?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Prüfbare Bedingungen; sichtbare Änderungen brauchen gegebenenfalls Runtime-Belege und menschliche Abnahme.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Grenzen und offene Entscheidungen
      description: Was ist ausdrücklich nicht Teil dieser Aufgabe? Welche Entscheidung darf ein Agent nicht selbst treffen?
  - type: textarea
    id: references
    attributes:
      label: Betroffene Dateien und Hintergrund
      description: Links zu Team-/Fachdokumenten und konkreten Quellen.
